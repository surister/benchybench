repos:
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        files: '\.rs$|Cargo\.(toml|lock)$'
        pass_filenames: false
# if test become heavy in the future, we can just do pre-push.
#        stages: [pre-push]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: '\.rs$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --
        language: system
        files: '\.rs$|Cargo\.(toml|lock)$'
        pass_filenames: false

